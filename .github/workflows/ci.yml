name: Build and smoke test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build prerequisites
        run: brew install cmake pkgconf
      - name: Identify Apple toolchain
        id: toolchain
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned media engines
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/media-engines/runtime
            .build/media-engines/downloads
          key: media-engines-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Tools/build-media-engines.py', 'Tools/media-build-requirements.txt', 'Tools/svg-renderer.cpp') }}
      - name: Build pinned media engines
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: python3 Tools/build-media-engines.py
      - name: Cache verified media engines
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/media-engines/runtime
            .build/media-engines/downloads
          key: media-engines-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Tools/build-media-engines.py', 'Tools/media-build-requirements.txt', 'Tools/svg-renderer.cpp') }}
      - name: Build app with pinned engines
        env:
          FILESPOKE_ENGINE_RUNTIME: .build/media-engines/runtime
        run: ./build.sh
      - name: Upload engine build logs after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-build-logs
          path: .build/media-engines/logs/
          if-no-files-found: ignore
      - name: Run packaged app smoke test
        run: build/FileSpoke.app/Contents/MacOS/FileSpoke --selftest
      - name: Verify bundled engines and signature
        run: |
          python3 Tools/verify-media-engines.py build/FileSpoke.app/Contents/Resources/MediaEngines
          codesign --verify --deep --strict build/FileSpoke.app
      - name: Check distributable metadata
        run: |
          if grep -qE '/Users/|/private/var/' build/FileSpoke.app/Contents/Resources/MediaEngines/manifest.json; then
            echo 'Local build paths leaked into the engine manifest' >&2
            exit 1
          fi
      - name: Package tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME"
          python3 Tools/package-release.py
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/release/* --generate-notes
          fi
